name: Atualizar lista filtrada
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python filter.py
      - name: Publicar
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add tvpaga.m3u
          git diff --cached --quiet || (git commit -m "Atualiza lista" && git push)
